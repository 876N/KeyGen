[package]
name = "stub"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "S"
path = "src/main.rs"

[dependencies]
kg_shared = { path = "../shared" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "2.4"

[features]
default = []
uac = []
dotnet = []
